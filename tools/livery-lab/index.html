<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livery lab</title>
  <style>
    :root { color-scheme: light; --ink: #1d2430; --muted: #5b6575; --line: #d9dee6; --bg: #f3f5f8; }
    body { margin: 0; font: 13px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); }
    header { padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: #fff; }
    header h1 { font-size: 16px; margin: 0; }
    header .muted { color: var(--muted); }
    #stage { position: fixed; left: -10000px; top: 0; } /* the one Cesium viewer renders off screen; tiles are copies */
    main { padding: 12px 16px; display: grid; gap: 16px; }
    .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 10px; }
    figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    figure img, figure canvas { display: block; width: 100%; height: auto; }
    figcaption { padding: 4px 8px; color: var(--muted); font-size: 12px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--line); }
    h2 { font-size: 14px; margin: 4px 0; }
    .atlas { background: repeating-conic-gradient(#e8ebf0 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  </style>
</head>
<body>
  <header><h1 id="title">Livery lab</h1><span class="muted" id="status">loading…</span></header>
  <div id="stage"></div>
  <main id="sheet"></main>
  <script type="module" src="./lab.ts"></script>
</body>
</html>
