# FlightHopper on the living-room TV (2026-09-30). The stream is the headless Hyprland output FHTV (3840x2160) that
# ~/.local/bin/fh-tv-start creates for the FlightHopper app; it is encoded on the Radeon (its render node).
sunshine_name = omarchy
capture = wlr
encoder = vaapi
adapter_name = /dev/dri/renderD129
# The web UI (pairing, apps) answers only on this machine: ssh omarchy, then https://localhost:47990.
origin_web_ui_allowed = pc
output_name = FHTV
