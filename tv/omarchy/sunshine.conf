# FlightHopper on the living-room TV (2026-09-30). The stream is the headless Hyprland output FHTV (1920x1080) that
# ~/.local/bin/fh-tv-start creates for the FlightHopper app; it is encoded on the Radeon (its render node).
sunshine_name = omarchy
capture = wlr
encoder = vaapi
adapter_name = /dev/dri/renderD129
# The web UI (pairing, apps) answers only on this machine: ssh omarchy, then https://localhost:47990.
origin_web_ui_allowed = pc
output_name = FHTV
# The TV's Wi-Fi takes only ~9 Mbit/s from omarchy (TCP test, 2026-09-30): Moonlight's own 1080p60 ask (20 Mbit/s)
# and even 7 Mbit/s filled the router's queue and stalled the whole home network. 5 Mbit/s HEVC leaves headroom.
max_bitrate = 5000
